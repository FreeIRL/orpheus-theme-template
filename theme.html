<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now Playing</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    #now-playing {
      font-family: "FOT-RodinNTLG Pro DB", sans-serif;
      font-size: 28px;
      color: white;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="now-playing">♪ Nothing playing ♪</div>

  <script>
    const nowPlaying = document.getElementById('now-playing');

    const eventSource = new EventSource('/api/stream');

    eventSource.addEventListener('track', (event) => {
      const track = JSON.parse(event.data);

      if (!track.playing) {
        nowPlaying.textContent = '♪ Nothing playing ♪';
        return;
      }

      nowPlaying.textContent = `♪ ${track.title} - ${track.artist} ♪`;
    });

    eventSource.onerror = () => {
      nowPlaying.textContent = '♪ Nothing playing ♪';
    };
  </script>
</body>
</html>
