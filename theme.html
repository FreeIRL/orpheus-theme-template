<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #now-playing {
      width: 100%;
      font-family: "FOT-RodinNTLG Pro DB", sans-serif;
      font-size: 28px;
      color: rgb(126 121 143);
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div id="now-playing">♪ Nothing is playing ♪</div>

  <script>
    const nowPlaying = document.getElementById('now-playing');

    const eventSource = new EventSource('/api/stream');

    eventSource.addEventListener('track', (event) => {
      const track = JSON.parse(event.data);

      console.log('TRACK EVENT:', track);
      console.log('playing:', track.playing);
      console.log('title:', track.title);
      console.log('artist:', track.artist);

      if (track.playing === false) {
        nowPlaying.textContent = '♪ Nothing is playing ♪';
        return;
      }

      if (track.playing === true) {
        nowPlaying.textContent =
          `♪ ${track.title} - ${track.artist} ♪`;
      }
    });
  </script>

</body>
</html>
