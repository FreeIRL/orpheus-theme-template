<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #now-playing {
      width: 100%;
      font-family: "FOT-RodinNTLG Pro DB", sans-serif;
      font-size: 28px;
      color: rgb(126 121 143);
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div id="now-playing">♪ Nothing is playing ♪</div>

  <script>
    const nowPlaying = document.getElementById('now-playing');

    function showNothingPlaying() {
      nowPlaying.textContent = '♪ Nothing is playing ♪';
    }

    function showTrack(track) {
      if (!track || !track.title || !track.artist) {
        showNothingPlaying();
        return;
      }

      nowPlaying.textContent =
        `♪ ${track.title} - ${track.artist} ♪`;
    }


    // -----------------------------------------
    // SSE — instant track updates
    // -----------------------------------------

    const eventSource = new EventSource('/api/stream');

    eventSource.addEventListener('track', (event) => {
      try {
        const track = JSON.parse(event.data);

        console.log('SSE track:', track);

        if (track.playing === false) {
          showNothingPlaying();
          return;
        }

        if (track.playing === true) {
          showTrack(track);
        }

      } catch (error) {
        console.error('SSE parse error:', error);
      }
    });


    // -----------------------------------------
    // Poll current state
    // -----------------------------------------

    async function checkCurrentTrack() {
      try {
        const response = await fetch(
          '/api/now-playing',
          {
            cache: 'no-store'
          }
        );

        if (!response.ok) {
          showNothingPlaying();
          return;
        }

        const track = await response.json();

        console.log('Current track:', track);

        if (
          track &&
          track.playing === true &&
          track.title &&
          track.artist
        ) {
          showTrack(track);
        } else {
          showNothingPlaying();
        }

      } catch (error) {
        console.error('Current track check failed:', error);
        showNothingPlaying();
      }
    }


    // Check immediately
    checkCurrentTrack();

    // Check every 2 seconds
    setInterval(checkCurrentTrack, 2000);

  </script>

</body>
</html>
