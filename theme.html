<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #now-playing {
      width: 100%;

      font-family: "FOT-RodinNTLG Pro DB", sans-serif;
      font-size: 28px;
      color: rgb(126 121 143);

      text-align: center;
      white-space: nowrap;

      transform: translateY(0);
    }

    #now-playing.song-change {
      animation: songBounce 500ms ease-out;
    }

    @keyframes songBounce {
      0% {
        transform: translateY(0);
      }

      /* Move down */
      35% {
        transform: translateY(10px);
      }

      /* Bounce upward */
      65% {
        transform: translateY(-4px);
      }

      /* Settle */
      100% {
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div id="now-playing"></div>

  <script>
    const nowPlaying = document.getElementById('now-playing');

    let currentTrackKey = '';

    function showTrack(track) {
      if (!track || !track.title || !track.artist) {
        return;
      }

      const newTrackKey =
        `${track.title}|||${track.artist}`;

      // Only animate when the actual song changes
      if (newTrackKey !== currentTrackKey) {
        currentTrackKey = newTrackKey;

        nowPlaying.textContent =
          `♪ ${track.title} - ${track.artist} ♪`;

        // Restart animation
        nowPlaying.classList.remove('song-change');

        // Force browser to reset the animation
        void nowPlaying.offsetWidth;

        nowPlaying.classList.add('song-change');
      }
    }


    // ==============================
    // SSE — instant song changes
    // ==============================

    const eventSource = new EventSource('/api/stream');

    eventSource.addEventListener('track', (event) => {
      try {
        const track = JSON.parse(event.data);

        if (track.playing === true) {
          showTrack(track);
        }

      } catch (error) {
        console.error('SSE parse error:', error);
      }
    });


    // ==============================
    // Poll current track
    // ==============================

    async function checkCurrentTrack() {
      try {
        const response = await fetch('/api/now-playing', {
          cache: 'no-store'
        });

        if (!response.ok) {
          return;
        }

        const track = await response.json();

        if (
          track &&
          track.playing === true &&
          track.title &&
          track.artist
        ) {
          showTrack(track);
        }

      } catch (error) {
        console.error(
          'Current track check failed:',
          error
        );
      }
    }

    checkCurrentTrack();

    setInterval(checkCurrentTrack, 2000);
  </script>

</body>
</html>
