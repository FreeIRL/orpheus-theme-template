<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #now-playing {
      width: 100%;
      font-family: "FOT-RodinNTLG Pro DB", sans-serif;
      font-size: 28px;
      color: rgb(126 121 143);
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div id="now-playing">♪ Nothing is playing ♪</div>

  <script>
    const nowPlaying = document.getElementById('now-playing');

    let lastPlayingUpdate = 0;

    // How long we'll trust the last "playing" event.
    const PLAYING_TIMEOUT = 5000;

    function showNothingPlaying() {
      nowPlaying.textContent = '♪ Nothing is playing ♪';
    }

    function showTrack(track) {
      nowPlaying.textContent =
        `♪ ${track.title || 'Unknown'} - ${track.artist || 'Unknown'} ♪`;
    }

    // Connect to SSE stream
    const eventSource = new EventSource('/api/stream');

    eventSource.addEventListener('track', (event) => {
      try {
        const track = JSON.parse(event.data);

        console.log('Track event:', track);

        // Explicitly stopped / paused
        if (track.playing === false) {
          lastPlayingUpdate = 0;
          showNothingPlaying();
          return;
        }

        // Valid playing state
        if (track.playing === true) {
          lastPlayingUpdate = Date.now();
          showTrack(track);
          return;
        }

        // Bad / empty event
        lastPlayingUpdate = 0;
        showNothingPlaying();

      } catch (error) {
        console.error('Invalid track event:', error);
        lastPlayingUpdate = 0;
        showNothingPlaying();
      }
    });

    // If Orpheus stops sending fresh playing events,
    // assume playback stopped.
    setInterval(() => {
      if (
        lastPlayingUpdate !== 0 &&
        Date.now() - lastPlayingUpdate > PLAYING_TIMEOUT
      ) {
        lastPlayingUpdate = 0;
        showNothingPlaying();
      }
    }, 1000);
  </script>

</body>
</html>
